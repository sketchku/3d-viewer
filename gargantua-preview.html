<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gargantua 배경 미리보기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0f1117;
      color: #e8eaed;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    #app { display: flex; height: 100vh; }
    .sidebar {
      width: 300px;
      min-width: 300px;
      background: #1a1d23;
      border-right: 1px solid #2d3139;
      overflow-y: auto;
      z-index: 10;
    }
    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #bg-pixels {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .bg-pixels-panel { padding: 16px 18px; }
    .bg-pixels-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .bg-pixels-panel-head h2 {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b919a;
    }
    .bg-pixels-reset {
      padding: 5px 10px;
      font-size: 0.72rem;
      background: #252830;
      border: 1px solid #2d3139;
      border-radius: 6px;
      color: #8b919a;
      cursor: pointer;
    }
    .bg-pixels-reset:hover { border-color: #4f8ff7; color: #4f8ff7; }
    .bg-pixels-group {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2d3139;
    }
    .bg-pixels-group:last-child { border-bottom: none; }
    .bg-pixels-group h3 {
      font-size: 0.78rem;
      font-weight: 600;
      color: #e8eaed;
      margin-bottom: 10px;
    }
    .bg-pixels-row { margin-bottom: 10px; }
    .bg-pixels-row label {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      color: #8b919a;
      margin-bottom: 5px;
    }
    .bg-pixels-val {
      font-variant-numeric: tabular-nums;
      color: #4f8ff7;
      min-width: 2.5rem;
      text-align: right;
    }
    .bg-pixels-row input[type="range"] {
      width: 100%;
      accent-color: #4f8ff7;
    }
    .overlay {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 2;
      pointer-events: none;
      font-size: 0.78rem;
      color: #555b66;
    }
  </style>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div id="bg-pixels-controls"></div>
    </aside>
    <main class="viewport" id="viewport">
      <canvas id="bg-pixels" aria-hidden="true"></canvas>
      <div class="overlay">슬라이더를 움직이면 실시간 반영됩니다</div>
    </main>
  </div>
  <script type="module">
    import { createBgPixels } from './bg-pixels.js';
    import { initBgPixelsUI } from './bg-pixels-ui.js';

    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('bg-pixels');
    const bg = createBgPixels(canvas, viewport);
    bg.setColor('#1a1d23');
    initBgPixelsUI(document.getElementById('bg-pixels-controls'), bg);

    function loop() {
      requestAnimationFrame(loop);
      bg.tick();
    }
    loop();
    window.addEventListener('resize', () => bg.resize());
  </script>
</body>
</html>
